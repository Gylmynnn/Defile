[package]
name = "rust_lib_defile"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
fs2 = "0.4.3"
resvg = "0.48.1"
lopdf = "0.34"
zavora-docx = "0.1.4"
office_oxide = "0.1.15"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
