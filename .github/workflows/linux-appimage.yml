name: Linux packages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  build:
    name: Linux packages (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libstdc++-12-dev \
            libmpv-dev \
            libepoxy-dev \
            rpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Flutter SDK
        id: flutter-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.tool_cache }}/flutter
          key: flutter-${{ runner.arch }}-${{ env.FLUTTER_VERSION }}

      - name: Install Flutter
        shell: bash
        env:
          FLUTTER_TARBALL: flutter_linux_${{ env.FLUTTER_VERSION }}-stable.tar.xz
        run: |
          set -euo pipefail
          SDK="$RUNNER_TOOL_CACHE/flutter"

          if [ "${{ steps.flutter-cache.outputs.cache-hit }}" != "true" ]; then
            rm -rf "$SDK"
            mkdir -p "$RUNNER_TOOL_CACHE"
            curl -fL --retry 3 -o /tmp/flutter.tar.xz \
              "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/${FLUTTER_TARBALL}"
            tar -xJf /tmp/flutter.tar.xz -C "$RUNNER_TOOL_CACHE"

            if [ "$RUNNER_ARCH" = "ARM64" ]; then
              # The official Linux archive ships an x64 Dart SDK and engine.
              # Remove them so Flutter bootstraps the arm64 artifacts.
              rm -rf "$SDK/bin/cache/dart-sdk" "$SDK/bin/cache/artifacts"
              rm -f \
                "$SDK/bin/cache/engine-dart-sdk.stamp" \
                "$SDK/bin/cache/engine.stamp" \
                "$SDK/bin/cache/flutter_tools.stamp" \
                "$SDK/bin/cache/flutter_tools.snapshot"
            fi
          fi

          echo "$SDK/bin" >> "$GITHUB_PATH"
          "$SDK/bin/flutter" --version

      - name: Configure Flutter
        run: |
          flutter config --no-analytics
          flutter pub get

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Linux release
        run: flutter build linux --release

      - name: Build AppImage
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          chmod +x scripts/build_appimage.sh
          SKIP_BUILD=1 scripts/build_appimage.sh

      - name: Build .deb
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          chmod +x scripts/build_deb.sh
          SKIP_BUILD=1 scripts/build_deb.sh
          dpkg-deb --info build/deb/*.deb
          # head closes the pipe early (SIGPIPE) which fails under `pipefail`,
          # so don't let the preview pipe fail the job.
          dpkg-deb --contents build/deb/*.deb | head -n 30 || true

      - name: Build .rpm
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          chmod +x scripts/build_rpm.sh
          SKIP_BUILD=1 scripts/build_rpm.sh
          # See above: preview pipe must not fail the job on SIGPIPE.
          rpm -qlp build/rpm/RPMS/*/*.rpm | head -n 30 || true

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: defile-linux-${{ matrix.arch }}
          path: |
            build/appimage/Defile-*-${{ matrix.arch }}.AppImage
            build/deb/*.deb
            build/rpm/RPMS/*/*.rpm
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download Linux packages
        uses: actions/download-artifact@v4
        with:
          pattern: defile-linux-*
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
          generate_release_notes: true
          fail_on_unmatched_files: true

  # Builds run on every push. Pushing a tag (e.g. v0.6.0) additionally creates
  # a GitHub release and uploads AppImages, .debs, and .rpms to it.
